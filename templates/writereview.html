
{% block content %}
  <h1>{% if existing_review %}Muokkaa arviota{% else %}Kirjoita arvio{% endif %}</h1>

  <form action="{{ url_for('submitreview') }}" method="post">
    {% if existing_review %}
      <input type="hidden" name="review_id" value="{{ existing_review.id }}">
    {% endif %}

    <select name="game_name">
      {% for game in games %}
        <option value="{{ game.name }}"
          {% if existing_review and existing_review.game_name == game.name %}selected{% endif %}>
          {{ game.name }}
        </option>
      {% endfor %}
    </select>

    <input type="number" name="score" min="0" max="10"
      value="{{ existing_review.score if existing_review else '' }}">

    <textarea name="review" maxlength="500">{{ existing_review.review if existing_review else '' }}</textarea>

    <button type="submit">Tallenna</button>
  </form>
{% endblock %}
