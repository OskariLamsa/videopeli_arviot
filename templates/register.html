
{% block content %}
  <h1>
  <a href="/">Minicritic: Pelien arviointisivusto</a>
  </h1>
  <h2>Luo tunnus</h2>

  {% if error %}
    <ul class="errors">
      {% if error is string %}
        <li>{{ error }}</li>
      {% else %}
        {% for e in error %}
          <li>{{ e }}</li>
        {% endfor %}
      {% endif %}
    </ul>
  {% endif %}

  <form action="{{ url_for('create') }}" method="post">
    <p>
        Tunnus: <br />
        <input type="text" name="username" maxlength="20" value="{{ username|default('') }}">    
    </p>
    <p>
        Salasana: <br />
        <input type="password" name="password1" value="{{ password1 if password1 else '' }}">    
    </p>
    <p>
        Salasana uudelleen: <br />
        <input type="password" name="password2" value="{{ password2 if password2 else '' }}">
    </p>
    <button type="submit">Luo tunnus</button>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  </form>
{% endblock %}
